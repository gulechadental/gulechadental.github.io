<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GDC Clinic Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; font-family: 'Nunito', sans-serif; background: #f5f5f4; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
    .mi { font-family: 'Material Symbols Rounded'; font-size: 24px; vertical-align: middle; font-variation-settings: 'FILL' 1; }
    
    /* Auth overlay - shown if iframe fails */
    #auth-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #f5f5f4;
      z-index: 10;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      padding: 24px;
    }
    #auth-overlay.show { display: flex; }
    #auth-overlay h2 { font-size: 22px; font-weight: 800; color: #1c1917; }
    #auth-overlay p { font-size: 15px; color: #57534e; max-width: 400px; line-height: 1.5; }
    #auth-overlay .mi { font-size: 48px; color: #0891b2; }
    .auth-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 24px; border-radius: 8px; font-size: 15px; font-weight: 700;
      text-decoration: none; color: #fff; background: #0891b2; border: none; cursor: pointer;
    }
    .auth-btn:hover { background: #0e7490; }
    .auth-btn-secondary {
      background: none; color: #0891b2; border: 2px solid #0891b2;
    }
    .auth-btn-secondary:hover { background: #ecfeff; }
  </style>
</head>
<body>
  <div id="auth-overlay">
    <span class="mi">dentistry</span>
    <h2>GDC Clinic Manager</h2>
    <p>You need to sign in to Google and authorize the app first. Click below to open the app in a new tab, sign in, then come back here.</p>
    <a href="https://script.google.com/macros/s/AKfycbxRqoFV7C_8_gCnDQOc2HHRz1Ezwu5Gkh8cgKuNaUnuuvdeRuKWfg131yWEoQWfe2DgwA/exec" 
       target="_blank" class="auth-btn" onclick="setTimeout(()=>location.reload(), 3000)">
      <span class="mi" style="font-size:20px">open_in_new</span> Open & Authorize App
    </a>
    <button class="auth-btn auth-btn-secondary" onclick="location.reload()">
      <span class="mi" style="font-size:20px">refresh</span> I've signed in — Reload
    </button>
  </div>

  <iframe 
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbxRqoFV7C_8_gCnDQOc2HHRz1Ezwu5Gkh8cgKuNaUnuuvdeRuKWfg131yWEoQWfe2DgwA/exec"
    allow="camera; clipboard-write"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-storage-access-by-user-activation"
  ></iframe>

  <script>
    // Detect if iframe fails to load (auth issue)
    const frame = document.getElementById('app-frame');
    const overlay = document.getElementById('auth-overlay');
    
    // If iframe loads successfully, it will have content
    // If blocked by Google auth, show the auth overlay after a timeout
    let loaded = false;
    
    frame.addEventListener('load', function() {
      loaded = true;
      // Try to detect if it loaded the actual app or an error page
      try {
        // Cross-origin will throw — that's fine, means it loaded something from Google
        const doc = frame.contentDocument;
      } catch(e) {
        // Cross-origin error = iframe loaded Google's domain = good
      }
    });
    
    // If after 5 seconds the iframe hasn't loaded, show auth overlay
    setTimeout(function() {
      if (!loaded) {
        overlay.classList.add('show');
      }
    }, 5000);
    
    // Also handle if iframe loads but shows error
    frame.addEventListener('error', function() {
      overlay.classList.add('show');
    });
  </script>
</body>
</html>
